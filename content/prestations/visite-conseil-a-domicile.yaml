titre: Visite conseil à domicile
accroche: Un rendez-vous d’environ 1 h 30 chez vous pour repartir avec un projet clair.
inclus:
  - État des lieux de la pièce à décorer (jusqu’à 30 m²)
  - Choix des couleurs et nouvel agencement de l’espace
  - Dessins et shopping list remis en fin de rendez-vous
  - Si besoin, offres de prix de mes artisans (peinture, sols, électricité…)
  - Existe aussi en coffret cadeau
tarif: Tarif sur demande
ordre: 1
